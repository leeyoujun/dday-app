<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day & 시험 일정 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid me-0 fa-calendar-check text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">D-Day Scheduler</h1>
          <p class="text-xs text-slate-400">학생 맞춤형 시험 & 일정 플래너</p>
        </div>
      </div>
      <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-plus"></i> 일정 추가
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8 w-full space-y-8 flex-1">
    
    <!-- Top D-Day Highlight Card -->
    <section id="mainCard" class="hidden relative overflow-hidden rounded-3xl bg-gradient-to-r from-indigo-900 via-slate-800 to-slate-900 border border-indigo-500/30 p-6 md:p-8 shadow-2xl">
      <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
        <div>
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 mb-3">
            <i class="fa-solid fa-star text-amber-400 mr-1.5"></i> 대표 일정 (D-Day)
          </span>
          <h2 id="mainTitle" class="text-2xl md:text-3xl font-extrabold text-white mb-2"></h2>
          <p id="mainDate" class="text-slate-400 text-sm flex items-center gap-2">
            <i class="fa-regular fa-calendar"></i> <span id="mainDateText"></span>
          </p>
        </div>
        <div class="bg-slate-900/60 backdrop-blur border border-slate-700/50 rounded-2xl px-6 py-4 text-center w-full md:w-auto">
          <div id="mainDays" class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400"></div>
          <div id="mainTime" class="text-xs text-slate-400 font-mono mt-1"></div>
        </div>
      </div>
    </section>

    <!-- Schedule List -->
    <section class="space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-indigo-400"></i> 내 일정 목록
        </h3>
        <span id="itemCount" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">총 0개</span>
      </div>

      <div id="scheduleGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Dynamic Cards -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="text-center py-16 bg-slate-800/30 rounded-2xl border border-dashed border-slate-700">
        <i class="fa-regular fa-calendar-xmark text-4xl text-slate-600 mb-3"></i>
        <p class="text-slate-400 font-medium">등록된 시험이나 일정이 없습니다.</p>
        <p class="text-xs text-slate-500 mt-1">우측 상단의 '일정 추가' 버튼을 눌러보세요.</p>
      </div>
    </section>

    <!-- Motivational Quote Footer Box -->
    <section class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 relative overflow-hidden">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div class="flex items-start gap-3">
          <div class="p-2 bg-amber-500/10 text-amber-400 rounded-lg shrink-0 mt-0.5 sm:mt-0">
            <i class="fa-solid fa-quote-left text-lg"></i>
          </div>
          <div>
            <p id="quoteText" class="text-slate-200 font-medium italic text-sm md:text-base">"오늘 할 수 있는 일에 전념하라. 그것이 내일을 준비하는 가장 좋은 방법이다."</p>
            <p id="quoteAuthor" class="text-xs text-slate-400 mt-1 font-sans">— 아이작 뉴턴</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0 self-end sm:self-center">
          <button onclick="openQuoteModal()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 border border-slate-600">
            <i class="fa-solid fa-pen-to-square"></i> 직접 수정
          </button>
          <button onclick="getRandomQuote()" class="text-xs bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 border border-indigo-500/30">
            <i class="fa-solid fa-shuffle"></i> 명언 추천
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Add Schedule Modal -->
  <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-calendar-plus text-indigo-400 mr-2"></i>새 일정 추가</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="scheduleForm" onsubmit="saveSchedule(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">일정 / 과목 이름</label>
          <input type="text" id="inputTitle" placeholder="예: 2학기 기말고사, 화학I 탐구보고서" required
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">목표 날짜</label>
          <input type="date" id="inputDate" required
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">메모 (선택)</label>
          <input type="text" id="inputMemo" placeholder="예: 범위: 3단원~4단원 전체"
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold text-slate-300 transition">취소</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-semibold text-white transition">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Quote Edit Modal -->
  <div id="quoteModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-quote-left text-amber-400 mr-2"></i>동기부여 문구 수정</h3>
        <button onclick="closeQuoteModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">문구 내용</label>
          <textarea id="editQuoteText" rows="3" placeholder="나만의 동기부여 문구를 입력하세요"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">출처 / 작성자</label>
          <input type="text" id="editQuoteAuthor" placeholder="예: 나 자신, 아인슈타인"
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeQuoteModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold text-slate-300 transition">취소</button>
          <button type="button" onclick="saveCustomQuote()" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition">적용하기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const sampleQuotes = [
      { text: "오늘 할 수 있는 일에 전념하라. 그것이 내일을 준비하는 가장 좋은 방법이다.", author: "아이작 뉴턴" },
      { text: "성공은 매일 반복한 작은 노력들의 합이다.", author: "로버트 콜리어" },
      { text: "시작하는 방법은 말하기를 그만두고 행동하는 것이다.", author: "월트 디즈니" },
      { text: "미래를 예측하는 가장 좋은 방법은 미래를 창조하는 것이다.", author: "피터 드러커" },
      { text: "꿈을 이루기 위해 필요한 것은 한 걸음의 용기다.", author: "명언" },
      { text: "끝까지 포기하지 않는 사람이 결국 승리한다.", author: "동기부여" }
    ];

    let schedules = JSON.parse(localStorage.getItem('dday_schedules')) || [
      { id: 1, title: '2학기 기말고사', date: '2026-12-15', memo: '전과목 목표 평균 95점 이상!' },
      { id: 2, title: '화학I 수행평가 제출', date: '2026-11-20', memo: '발표자료 최종 수정 완료하기' }
    ];

    let currentQuote = JSON.parse(localStorage.getItem('dday_quote')) || sampleQuotes[0];

    function init() {
      renderQuotes();
      renderSchedules();
      setInterval(updateTimers, 1000);
    }

    function renderQuotes() {
      document.getElementById('quoteText').innerText = `"${currentQuote.text}"`;
      document.getElementById('quoteAuthor').innerText = `— ${currentQuote.author}`;
    }

    function getRandomQuote() {
      const randomIndex = Math.floor(Math.random() * sampleQuotes.length);
      currentQuote = sampleQuotes[randomIndex];
      localStorage.setItem('dday_quote', JSON.stringify(currentQuote));
      renderQuotes();
    }

    function openQuoteModal() {
      document.getElementById('editQuoteText').value = currentQuote.text;
      document.getElementById('editQuoteAuthor').value = currentQuote.author;
      document.getElementById('quoteModal').classList.remove('hidden');
      document.getElementById('quoteModal').classList.add('flex');
    }

    function closeQuoteModal() {
      document.getElementById('quoteModal').classList.add('hidden');
      document.getElementById('quoteModal').classList.remove('flex');
    }

    function saveCustomQuote() {
      const text = document.getElementById('editQuoteText').value.trim();
      const author = document.getElementById('editQuoteAuthor').value.trim() || '익명';
      if (!text) return alert('문구를 입력해주세요.');

      currentQuote = { text, author };
      localStorage.setItem('dday_quote', JSON.stringify(currentQuote));
      renderQuotes();
      closeQuoteModal();
    }

    function renderSchedules() {
      const grid = document.getElementById('scheduleGrid');
      const emptyState = document.getElementById('emptyState');
      const mainCard = document.getElementById('mainCard');
      const itemCount = document.getElementById('itemCount');

      grid.innerHTML = '';
      itemCount.innerText = `총 ${schedules.length}개`;

      if (schedules.length === 0) {
        emptyState.classList.remove('hidden');
        mainCard.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      mainCard.classList.remove('hidden');

      // Sort by date
      schedules.sort((a, b) => new Date(a.date) - new Date(b.date));

      // Main D-Day set (First item)
      const topItem = schedules[0];
      document.getElementById('mainTitle').innerText = topItem.title;
      document.getElementById('mainDateText').innerText = topItem.date;

      schedules.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 hover:border-slate-600 transition flex flex-col justify-between space-y-4 shadow-lg";

        const targetDate = new Date(item.date + 'T00:00:00');
        const now = new Date();
        const diffTime = targetDate - now;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        let badgeClass = "bg-slate-700 text-slate-300";
        let dDayText = `D-${diffDays}`;

        if (diffDays === 0) {
          dDayText = "D-Day";
          badgeClass = "bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse";
        } else if (diffDays < 0) {
          dDayText = `D+${Math.abs(diffDays)}`;
          badgeClass = "bg-gray-700 text-gray-400";
        } else if (diffDays <= 7) {
          badgeClass = "bg-amber-500/20 text-amber-400 border border-amber-500/30";
        } else {
          badgeClass = "bg-indigo-500/20 text-indigo-300 border border-indigo-500/30";
        }

        card.innerHTML = `
          <div class="flex justify-between items-start gap-3">
            <div>
              <div class="flex items-center gap-2 mb-1">
                ${index === 0 ? '<span class="text-[10px] font-bold bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded border border-amber-500/30">TOP</span>' : ''}
                <h4 class="font-bold text-white text-base">${item.title}</h4>
              </div>
              <p class="text-xs text-slate-400 flex items-center gap-1">
                <i class="fa-regular fa-calendar"></i> ${item.date}
              </p>
            </div>
            <span class="text-xs font-extrabold px-3 py-1 rounded-full ${badgeClass}">${dDayText}</span>
          </div>

          ${item.memo ? `<p class="text-xs text-slate-400 bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">${item.memo}</p>` : ''}

          <div class="flex justify-end items-center border-t border-slate-700/50 pt-3">
            <button onclick="deleteSchedule(${item.id})" class="text-xs text-slate-500 hover:text-red-400 transition flex items-center gap-1">
              <i class="fa-regular fa-trash-can"></i> 삭제
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      updateTimers();
    }

    function updateTimers() {
      if (schedules.length === 0) return;

      const topItem = schedules[0];
      const targetDate = new Date(topItem.date + 'T00:00:00');
      const now = new Date();
      const diffTime = targetDate - now;

      const daysEl = document.getElementById('mainDays');
      const timeEl = document.getElementById('mainTime');

      if (diffTime <= 0 && Math.abs(diffTime) < 86400000) {
        daysEl.innerText = "D-DAY";
        timeEl.innerText = "오늘이 D-Day입니다!";
        return;
      }

      const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diffTime % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diffTime % (1000 * 60)) / 1000);

      if (days >= 0) {
        daysEl.innerText = `D-${days}`;
        timeEl.innerText = `${String(hours).padStart(2, '0')}시간 ${String(minutes).padStart(2, '0')}분 ${String(seconds).padStart(2, '0')}초 남음`;
      } else {
        daysEl.innerText = `D+${Math.abs(days)}`;
        timeEl.innerText = "지나간 일정입니다.";
      }
    }

    function openModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('addModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
      document.getElementById('scheduleForm').reset();
    }

    function saveSchedule(e) {
      e.preventDefault();
      const title = document.getElementById('inputTitle').value.trim();
      const date = document.getElementById('inputDate').value;
      const memo = document.getElementById('inputMemo').value.trim();

      if (!title || !date) return;

      const newItem = {
        id: Date.now(),
        title,
        date,
        memo
      };

      schedules.push(newItem);
      localStorage.setItem('dday_schedules', JSON.stringify(schedules));
      renderSchedules();
      closeModal();
    }

    function deleteSchedule(id) {
      if (!confirm('이 일정을 삭제하시겠습니까?')) return;
      schedules = schedules.filter(item => item.id !== id);
      localStorage.setItem('dday_schedules', JSON.stringify(schedules));
      renderSchedules();
    }

    init();
  </script>
</body>
</html>
